version: '3.8'

services:
  frontend:
    image: node:18-alpine
    working_dir: /app
    command: sh -c "npm install && npm start"
    ports:
      - "3000:3000"
    environment:
      REACT_APP_SUPABASE_URL: ${REACT_APP_SUPABASE_URL}
      REACT_APP_SUPABASE_ANON_KEY: ${REACT_APP_SUPABASE_ANON_KEY}
      REACT_APP_DEFAULT_ORG_SLUG: ${REACT_APP_DEFAULT_ORG_SLUG:-sasol-chemicals-la}
    volumes:
      - ./frontend:/app
      - /app/node_modules
